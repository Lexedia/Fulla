[settings]
experimental = true

[tools]
node = { version = "24", postinstall = "corepack enable" }
typos = "latest"
jq = "latest"
rust = "1.93"

[hooks]
postinstall = [
    "printf '#!/usr/bin/env bash\n$(which mise) task run _precommit > .git/hooks/pre-commit",
    "chmod +x .git/hooks/pre-commit",
]

[tasks._precommit]
hide = true
run = ""

[shell_alias]
psql = "docker compose exec -it postgres psql -U fulla -d fulla"
meili = "docker compose exec -it meilisearch meilisearch"
