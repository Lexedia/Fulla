api:
  dashboard: true
  insecure: true

entryPoints:
  web:
    address: ":80"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false

http:
  middlewares:
    upload-limit:
      buffering:
        maxRequestBodyBytes: 104857600  # 100MB default
        memRequestBodyBytes: 10485760   # 10MB
